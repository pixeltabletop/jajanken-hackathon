# Corre `npm run check` en una máquina limpia en cada push: tipos, tokens de
# tema, contraste, ausencia de salidas a red, troceo de audio, locks del motor
# y las reglas de producto. Que compile en el equipo de quien lo escribió no
# prueba que compile en el de quien lo descarga.
#
# Se instala con `--ignore-scripts` a propósito: el postinstall de
# electron-builder se baja el binario de Electron y aquí no hace falta, porque
# estas comprobaciones no arrancan la aplicación.

name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    # Windows a propósito, no Linux: es la plataforma que la entrega declara y
    # para la que se construye el instalador, y varias comprobaciones importan
    # el SDK de QVAC, que trae binarios por plataforma. Correrlas donde la
    # entrega no se usa probaria menos, no mas.
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Comprobaciones del repositorio
        run: npm run check
