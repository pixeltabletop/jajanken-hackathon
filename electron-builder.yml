appId: com.jajanken.mam
productName: MAM
asar: false
directories:
  buildResources: build
files:
  # Lo que NO viaja dentro del instalador. `bench/` son 3,5 MB de mediciones,
  # `reference/` contiene el brief y el workbook de Philips (su documento, no el
  # nuestro: no se redistribuye dentro de nuestro artefacto), `audio/` son
  # pruebas de dictado y `docs/` es documentación del repositorio.
  # Motores de QVAC que la aplicación NO usa. El SDK trae backends para difusión,
  # traducción, OCR, texto a voz, audio generativo, BCI, clasificación y VLA;
  # nosotros solo llamamos a tres: LLM (llamacpp), embeddings y ASR. Son 2,1 GB
  # de binarios que no se ejecutan nunca. Excluirlos es lo que baja el instalador
  # de 1,01 GB a la mitad, y está VERIFICADO arrancando el empaquetado después.
  - '!node_modules/@qvac/diffusion-cpp'
  - '!node_modules/@qvac/translation-nmtcpp'
  - '!node_modules/@qvac/ocr-ggml'
  - '!node_modules/@qvac/tts-ggml'
  - '!node_modules/@qvac/audiogen-ggml'
  - '!node_modules/@qvac/bci-whispercpp'
  - '!node_modules/@qvac/vla-ggml'
  - '!node_modules/@qvac/classification-ggml'
  # El workbook de Philips es su documento: no se redistribuye dentro del nuestro.
  - '!data/Dummy_Installed_Base_Hackathon.xlsx'
  - '!reference'
  - '!audio'
  - '!docs'
  - '!scripts'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: MAM
nsis:
  # ${productName}, no ${name}: el paquete se llama 'mam' en minusculas y el
  # producto MAM. El README promete MAM-1.0.0-setup.exe y tiene que cumplirlo.
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Sin actualización automática: la aplicación se entrega como instalador y no
# habla con ningún servidor. El bloque `publish` del andamiaje apuntaba a
# example.com, que es exactamente el tipo de detalle que un jurado encuentra.
publish: null

